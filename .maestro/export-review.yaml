appId: com.meeshogi.app
---
- launchApp
- tapOn: '棋譜.*'
- tapOn: '.*KeroPona.*'
- tapOn: 棋譜の操作
- tapOn: KIFを書き出す
- takeScreenshot: 33-system-share
- runFlow:
    when:
      platform: Android
    commands:
      # The collapsed Android sharesheet occupies only the bottom of the
      # screen. A center-origin scroll can dismiss it by hitting the scrim.
      - repeat:
          times: 4
          while:
            notVisible: Meeshogi Export Test
          commands:
            - swipe:
                start: 50%, 90%
                end: 50%, 65%
      - assertVisible: Meeshogi Export Test
      - takeScreenshot: 33-system-share-expanded
      - tapOn: Meeshogi Export Test
      - extendedWaitUntil:
          visible:
            id: game-screen
          timeout: 30000
