appId: com.meeshogi.app
env:
  INITIAL_READY_TIMEOUT: ${INITIAL_READY_TIMEOUT || 60000}
---
# Issue #22: developer comparison export. The menu item exists only when the
# Release build was bundled with EXPO_PUBLIC_ENABLE_ANALYSIS_EXPORT=1. The
# file is written to the deterministic cache path
# meeshogi-comparison-<gameId>.json BEFORE the share sheet opens; the
# acceptance scripts pull it (Android: helper share target -> /sdcard/Download;
# iOS: Library/Caches inside the app container) and run analysis-compare.
- launchApp
- extendedWaitUntil:
    visible:
      id: library-screen
    timeout: ${INITIAL_READY_TIMEOUT}
- extendedWaitUntil:
    visible: '.*KeroPona.*'
    timeout: 30000
- tapOn: '.*KeroPona.*'
- extendedWaitUntil:
    visible:
      id: game-screen
    timeout: 30000
- tapOn: 棋譜の操作
- waitForAnimationToEnd
- takeScreenshot: c70-game-menu
# The item must exist in this build; if it does not the release bundle lacks
# EXPO_PUBLIC_ENABLE_ANALYSIS_EXPORT=1 and that is the failure to report.
- assertVisible: '比較レポートを書き出す（開発用）'
- tapOn: '比較レポートを書き出す（開発用）'
- waitForAnimationToEnd
- takeScreenshot: c71-export-share-sheet
- runFlow:
    when:
      platform: Android
    commands:
      # Route the share through the CI helper so the JSON bytes also land in
      # /sdcard/Download/meeshogi-comparison.json (Release builds have no
      # run-as access to the app cache). The collapsed sharesheet truncates
      # long labels, so match a prefix; expansion can need several swipes with
      # a settle between each (a single fling can overshoot the row).
      - repeat:
          times: 8
          while:
            notVisible: 'Meeshogi Export.*'
          commands:
            - swipe:
                start: 50%, 90%
                end: 50%, 55%
            - waitForAnimationToEnd
      - runFlow:
          when:
            visible: 'Meeshogi Export.*'
          commands:
            - tapOn: 'Meeshogi Export.*'
            # After the helper receives the share the app shows the
            # '書き出しました' Alert, which covers the game-screen testID —
            # so wait on the alert text, not the screen id (verified on
            # evidence/issue22-android-20260927: target tap landed, write
            # succeeded, but the game-screen wait timed out on the Alert).
            - extendedWaitUntil:
                visible: '.*書き出しました.*'
                timeout: 30000
      - runFlow:
          when:
            notVisible: '.*書き出しました.*'
          commands:
            # Only reachable when the helper target was never tapped (the
            # tapped branch already waited on the alert) — either the target
            # stayed missing with the sheet open, or the write alert is
            # genuinely absent. Record the sheet state, settle, then let the
            # real alert assert decide (it may still be animating in).
            - takeScreenshot: c71b-export-share-state
            - waitForAnimationToEnd
            - assertVisible: '.*書き出しました.*'
- runFlow:
    when:
      platform: iOS
    commands:
      # Same idiom as export-review-ios: 'Save to Files' completes the
      # activity and dismisses the sheet (the Files browser never mounts
      # under automation — that is fine, the file is already in the app
      # container's Library/Caches for the script to pull).
      - scrollUntilVisible:
          element:
            text: 'Save to Files|ファイルに保存'
          direction: DOWN
          timeout: 20000
          optional: true
      - tapOn:
          text: 'Save to Files|ファイルに保存'
          optional: true
      - tapOn:
          text: '閉じる|Close|完了|Done'
          optional: true
- extendedWaitUntil:
    visible: '.*書き出しました.*'
    timeout: 60000
- takeScreenshot: c72-export-written
- tapOn:
    text: OK
    optional: true
