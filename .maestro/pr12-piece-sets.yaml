# ==== Persistence: kill + relaunch must keep 青磁 (SQLite settings row) ====
- stopApp
- launchApp
- extendedWaitUntil:
    visible:
      id: library-screen
    timeout: 60000
- tapOn: '.*KeroPona.*'
- extendedWaitUntil:
    visible:
      id: board-flip
    timeout: 30000
- tapOn:
    id: move-last
- tapOn:
    id: move-prev
    repeat: 13
    delay: 800
- assertVisible: '67 / 80手'
- takeScreenshot: 80-board-seiji-after-relaunch-dark
# Persistence is proven through the settings row (backed by the SQLite
# settings payload); the picker shot keeps the visual 選択中 evidence.
- tapOn: '^戻る$|^Back$'
- tapOn: '設定.*'
- extendedWaitUntil:
    visible:
      id: settings-screen
    timeout: 30000
- scrollUntilVisible:
    element:
      text: '.*駒セット, 青磁.*'
    direction: UP
- assertVisible: '.*駒セット, 青磁.*'
- scrollUntilVisible:
    element:
      id: piece-sets-link
    direction: DOWN
- tapOn:
    id: piece-sets-link
- extendedWaitUntil:
    visible:
      id: piece-sets-screen
    timeout: 30000
- scrollUntilVisible:
    element:
      id: piece-set-seiji
    direction: DOWN
- takeScreenshot: 81-picker-seiji-persisted-dark

