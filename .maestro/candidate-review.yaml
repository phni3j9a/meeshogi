appId: com.meeshogi.app
---
- launchApp
- tapOn: '.*KeroPona.*'
- tapOn:
    id: move-first
- scrollUntilVisible:
    element:
      id: candidate-0
    direction: DOWN
- tapOn:
    id: candidate-0
- assertVisible: 分岐検討
- scrollUntilVisible:
    element:
      text: '0手目から分岐'
    direction: UP
- takeScreenshot: 45-candidate-variation
# Branches only try legal moves: no evaluation or candidates are shown.
- assertNotVisible:
    id: current-evaluation
- scrollUntilVisible:
    element:
      text: '分岐では評価値・候補手を表示しません.*'
    direction: DOWN
- tapOn:
    id: move-first
- runFlow:
    when:
      platform: Android
    commands:
      - pressKey: Back
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn: 本譜に戻る
- assertVisible: '0 / 80手'
- scrollUntilVisible:
    element:
      id: analysis-status
    direction: DOWN
- takeScreenshot: 46-mainline-after-candidate
