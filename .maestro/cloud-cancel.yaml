appId: com.meeshogi.app
env:
  INITIAL_READY_TIMEOUT: ${INITIAL_READY_TIMEOUT || 60000}
---
# Issue #22: explicit cancel is the only path that posts /cancel. A second
# Free attempt is started and cancelled immediately; the server-confirmed
# 'cancelled' state must appear. (If the job raced to completion first the
# completed label is also terminal evidence; the DB snapshot distinguishes.)
- launchApp
- extendedWaitUntil:
    visible:
      id: library-screen
    timeout: ${INITIAL_READY_TIMEOUT}
- extendedWaitUntil:
    visible: '.*KeroPona.*'
    timeout: 30000
- tapOn: '.*KeroPona.*'
- extendedWaitUntil:
    visible:
      id: game-screen
    timeout: 30000
- scrollUntilVisible:
    element:
      id: analysis-method
    direction: DOWN
- tapOn:
    id: analysis-method
- waitForAnimationToEnd
- tapOn: Cloud・無料
- waitForAnimationToEnd
# The completed attempt exists -> the button reads 'Cloud解析を再試行'.
- tapOn:
    id: cloud-start
    waitToSettleTimeoutMs: 500
- extendedWaitUntil:
    visible: '.*Cloud解析を開始しています.*|.*Cloud解析の順番を待っています.*|.*Cloud解析中・処理.*|Cloud解析が完了しました|.*Cloud解析が終了しました.*'
    timeout: 120000
- takeScreenshot: c40-second-job-running
- runFlow:
    when:
      visible:
        id: cloud-cancel
    commands:
      - tapOn:
          id: cloud-cancel
          waitToSettleTimeoutMs: 500
      - takeScreenshot: c41-cancelling
- extendedWaitUntil:
    visible: 'Cloud解析を取消しました|Cloud解析が完了しました|.*Cloud解析が終了しました.*'
    timeout: 120000
- takeScreenshot: c42-cancelled
