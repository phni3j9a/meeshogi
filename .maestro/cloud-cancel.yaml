appId: com.meeshogi.app
env:
  INITIAL_READY_TIMEOUT: ${INITIAL_READY_TIMEOUT || 60000}
---
# Issue #22: explicit cancel is the only path that posts /cancel. This flow
# starts the FIRST Free attempt on the fixture game and cancels it as soon as
# the server has created the job ('順番を待っています'/'Cloud解析中' mean a
# jobId exists server-side), so the '取消しました' label is server-confirmed,
# not a local pre-POST abort. cloud-free-start then creates a fresh attempt
# ('再試行') for the interruption/verify runs.
- launchApp
- extendedWaitUntil:
    visible:
      id: library-screen
    timeout: ${INITIAL_READY_TIMEOUT}
- extendedWaitUntil:
    visible: '.*KeroPona.*'
    timeout: 30000
- tapOn: '.*KeroPona.*'
- extendedWaitUntil:
    visible:
      id: game-screen
    timeout: 30000
- scrollUntilVisible:
    element:
      id: analysis-method
    direction: DOWN
- tapOn:
    id: analysis-method
- waitForAnimationToEnd
- tapOn: Cloud・無料
- waitForAnimationToEnd
- tapOn:
    id: cloud-start
    waitToSettleTimeoutMs: 500
# Wait for queued/running specifically — '開始しています' is still pre-POST.
- extendedWaitUntil:
    visible: '.*Cloud解析の順番を待っています.*|.*Cloud解析中・処理.*|Cloud解析が完了しました|.*Cloud解析が終了しました.*'
    timeout: 120000
- takeScreenshot: c40-job-live
- runFlow:
    when:
      visible:
        id: cloud-cancel
    commands:
      - tapOn:
          id: cloud-cancel
          waitToSettleTimeoutMs: 500
      - takeScreenshot: c41-cancelling
- extendedWaitUntil:
    visible: 'Cloud解析を取消しました|Cloud解析が完了しました|.*Cloud解析が終了しました.*'
    timeout: 120000
- takeScreenshot: c42-cancelled
