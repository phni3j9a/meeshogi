appId: com.meeshogi.app
---
- launchApp
- extendedWaitUntil:
    visible:
      id: library-screen
    timeout: 60000
# Set the standard budget explicitly; flows share persisted app settings.
- tapOn: '設定.*'
- extendedWaitUntil:
    visible:
      id: settings-screen
    timeout: 30000
- scrollUntilVisible:
    element:
      text: 解析の長さ
    direction: DOWN
- tapOn: 解析の長さ
- tapOn: 標準
- tapOn:
    id: tab-games
- extendedWaitUntil:
    visible:
      text: '.*KeroPona.*'
    timeout: 30000
- tapOn: '.*KeroPona.*'
- scrollUntilVisible:
    element:
      id: analysis-start
    direction: DOWN
- tapOn:
    id: analysis-start
    waitToSettleTimeoutMs: 500
# In the refreshed layout the 'analysis-status' label sits below the fold;
# wait on the visible completion paragraph instead (same 'analysis ended'
# semantics: it only renders once a partial run finishes).
- extendedWaitUntil:
    visible: '.*局面を解析済み、.*局面は探索量不足です.*'
    timeout: 600000
- assertVisible: '.*局面を解析済み、.*局面は探索量不足です.*'
- scrollUntilVisible:
    element:
      id: analysis-status
    direction: DOWN
- assertVisible: 解析処理が終了しました
- assertNotVisible: 全局解析が完了しました
- takeScreenshot: 51-partial-analysis

# Ply 41 is a known budget-shortfall position in the KeroPona fixture.
- tapOn:
    id: move-last
- tapOn:
    id: move-prev
    repeat: 39
    delay: 800
- runFlow:
    when:
      visible: '42 / 80手'
    commands:
      - tapOn:
          id: move-prev
- runFlow:
    when:
      visible: '40 / 80手'
    commands:
      - tapOn:
          id: move-next
- assertVisible: '41 / 80手'
- scrollUntilVisible:
    element:
      text: '—'
    direction: UP
- assertVisible: '—'
- assertNotVisible:
    id: candidate-0
- assertVisible: 下の解析ボタンから候補手を確認できます。
- takeScreenshot: 52-partial-skipped-ply

# A second run must be a finite partial retry, not an error state or crash.
- scrollUntilVisible:
    element:
      id: analysis-start
    direction: DOWN
- assertVisible:
    id: analysis-start
- assertVisible: 解析を再開
- tapOn:
    id: analysis-start
    waitToSettleTimeoutMs: 500
- extendedWaitUntil:
    visible: '.*局面を解析済み、.*局面は探索量不足です.*'
    timeout: 600000
- assertVisible: '.*局面を解析済み、.*局面は探索量不足です.*'
- scrollUntilVisible:
    element:
      id: analysis-status
    direction: DOWN
- assertVisible: 解析処理が終了しました
- assertNotVisible: 全局解析が完了しました
- assertNotVisible: 解析を再開できます
- assertNotVisible: '解析に失敗しました。もう一度解析できます。'
