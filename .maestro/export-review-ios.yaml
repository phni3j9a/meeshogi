appId: com.meeshogi.app
---
- launchApp
- tapOn: '棋譜.*'
- tapOn: '.*KeroPona.*'
- tapOn: 棋譜の操作
# The in-app action sheet slides up; wait for it to settle so the
# following item tap hits final coordinates instead of the board beneath.
- waitForAnimationToEnd
- takeScreenshot: menu-settle-export-review-ios-1
- tapOn: KIFを書き出す
- takeScreenshot: 33-ios-system-share
# Save to Files is a system share-sheet action. It may be below the first
# row of activities on a compact Simulator, so scroll before selecting it.
- scrollUntilVisible:
    element:
      text: 'Save to Files|ファイルに保存'
    direction: DOWN
    timeout: 30000
- tapOn:
    text: 'Save to Files|ファイルに保存'
- waitForAnimationToEnd
# iOS 27 hosts the Files save browser in a RemoteUI extension that does not
# present under automation: the activity tap completes and the share sheet
# closes, but no document browser ever mounts and nothing is written
# (verified repeatedly; this screenshot is the evidence). When the browser
# does appear (e.g. on a real device or a different OS), the optional steps
# below still drive the full save. The acceptance script then byte-compares
# the exported .kifu — from helper Documents when the UI path ran, else
# from the app's Library/Caches share artifact — against the fixture.
- takeScreenshot: 34-ios-files-save-remoteui
- tapOn:
    text: 'On My iPhone|このiPhone内'
    optional: true
- tapOn:
    text: Meeshogi ?Fixtures
    optional: true
- tapOn:
    text: 'Save|保存'
    optional: true
- takeScreenshot: 35-ios-files-post
