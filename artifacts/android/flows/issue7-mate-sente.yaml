appId: com.meeshogi.app
---
# Issue #7: mate-sente-win.kif (27 plies, legal board checkmate, sente wins).
# Clipboard must already contain the KIF (android-clipboard.sh).
# autoAnalyze (長め=50000) starts on save; the job aborts at ply 2 with the
# meta-range contract error — capture it, then verify the checkmate eval via
# focused analysis on the terminal position.
- launchApp
- extendedWaitUntil:
    visible:
      id: library-screen
    timeout: 60000
- tapOn:
    id: import-button
- extendedWaitUntil:
    visible:
      id: import-paste
    timeout: 60000
- tapOn:
    id: import-paste
- tapOn:
    text: 'Allow Paste|ペーストを許可'
    optional: true
- extendedWaitUntil:
    visible: '.*27手の棋譜を読み取りました.*'
    timeout: 60000
- swipe:
    start: 95%, 85%
    end: 95%, 30%
- scrollUntilVisible:
    element:
      id: import-save
    direction: DOWN
- tapOn:
    id: import-save
- extendedWaitUntil:
    visible:
      id: game-screen
    timeout: 30000
# autoAnalyze already running; wait for the job to die on the engine contract error
- extendedWaitUntil:
    visible: 解析を再開できます
    timeout: 360000
- assertVisible: '.*meta の整数範囲が不正.*'
- takeScreenshot: sente-01-meta-contract-error
# Focused analysis on the terminal position must still display the mate result.
- tapOn:
    id: move-last
- assertVisible: '27 / 27手'
- scrollUntilVisible:
    element:
      id: analysis-focus
    direction: DOWN
- tapOn:
    id: analysis-focus
- extendedWaitUntil:
    visible: この局面の追加解析結果を表示中
    timeout: 120000
- assertVisible: 先手勝ち・詰み終局
- assertNotVisible: '.*手詰め ›'
- takeScreenshot: sente-02-checkmate-eval
