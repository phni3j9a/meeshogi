appId: com.meeshogi.app
env:
  MATE_PLY: '29'
  MATE_TEXT: 先手勝ち・詰み終局
  TAG: mate-sente
---
# Issue #7 mate-display check. Env: MATE_PLY (e.g. 29), MATE_TEXT (e.g. '先手勝ち・詰み終局'), TAG.
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: library-screen
    timeout: 180000
- tapOn:
    id: import-button
- extendedWaitUntil:
    visible:
      id: import-paste
    timeout: 60000
- tapOn:
    id: import-paste
- tapOn:
    text: 'Allow Paste|ペーストを許可'
    optional: true
- extendedWaitUntil:
    visible: ".*${MATE_PLY}手の棋譜を読み取りました.*"
    timeout: 60000
- swipe:
    start: 95%, 85%
    end: 95%, 30%
- scrollUntilVisible:
    element:
      id: import-save
    direction: DOWN
- tapOn:
    id: import-save
- extendedWaitUntil:
    visible:
      id: game-screen
    timeout: 120000
- tapOn:
    id: move-last
- assertVisible: ".*${MATE_PLY} / ${MATE_PLY}手"
# Focused analysis on the terminal position (deep analysis path, 50k nodes).
- scrollUntilVisible:
    element:
      id: analysis-focus
    direction: DOWN
    timeout: 30000
- takeScreenshot: "${TAG}-01-terminal-pre"
- tapOn:
    id: analysis-focus
- extendedWaitUntil:
    visible:
      id: focused-analysis-ready
    timeout: 180000
- assertVisible: "${MATE_TEXT}"
- takeScreenshot: "${TAG}-02-terminal-display"
- scrollUntilVisible:
    element:
      text: '先手評価'
    direction: UP
    timeout: 30000
- takeScreenshot: "${TAG}-03-graph"
