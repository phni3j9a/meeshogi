appId: com.meeshogi.app
env:
  INITIAL_READY_TIMEOUT: 180000
  IMPORT_SAVE_TIMEOUT: 120000
---
# Issue #7 partial-end acceptance (1887617): full scan -> skip budget
# shortfalls -> 'partial' end with aggregated notice.
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: library-screen
    timeout: ${INITIAL_READY_TIMEOUT}
- tapOn:
    id: import-button
- extendedWaitUntil:
    visible:
      id: import-paste
    timeout: 60000
- tapOn:
    id: import-paste
- tapOn:
    text: 'Allow Paste|ペーストを許可'
    optional: true
- extendedWaitUntil:
    visible: '.*棋譜を読み取りました.*'
    timeout: 60000
- assertVisible: '.*KeroPona.*'
- swipe:
    start: 95%, 85%
    end: 95%, 30%
- scrollUntilVisible:
    element:
      id: import-save
    direction: DOWN
- tapOn:
    id: import-save
- extendedWaitUntil:
    visible:
      id: game-screen
    timeout: ${IMPORT_SAVE_TIMEOUT}
# Auto-analysis runs at default 10k nodes; wait for the terminal state.
- scrollUntilVisible:
    element:
      id: analysis-status
    direction: DOWN
    timeout: 60000
- extendedWaitUntil:
    visible: '解析処理が終了しました|全局解析が完了しました|解析に失敗しました'
    timeout: 600000
- assertVisible:
    id: analysis-status
    text: '解析処理が終了しました'
- assertVisible: '.*局面は探索量不足です.*'
- assertNotVisible:
    text: '.*全局解析が完了しました.*'
- takeScreenshot: partial-01-partial-end
# Navigate to the first skipped ply (index 41) and verify no stored result.
- tapOn:
    id: move-first
- tapOn:
    id: move-next
- tapOn:
    id: move-next
- tapOn:
    id: move-next
- tapOn:
    id: move-next
- tapOn:
    id: move-next
- tapOn:
    id: move-next
- tapOn:
    id: move-next
- tapOn:
    id: move-next
- tapOn:
    id: move-next
- tapOn:
    id: move-next
- tapOn:
    id: move-next
- tapOn:
    id: move-next
- tapOn:
    id: move-next
- tapOn:
    id: move-next
- tapOn:
    id: move-next
- tapOn:
    id: move-next
- tapOn:
    id: move-next
- tapOn:
    id: move-next
- tapOn:
    id: move-next
- tapOn:
    id: move-next
- tapOn:
    id: move-next
- tapOn:
    id: move-next
- tapOn:
    id: move-next
- tapOn:
    id: move-next
- tapOn:
    id: move-next
- tapOn:
    id: move-next
- tapOn:
    id: move-next
- tapOn:
    id: move-next
- tapOn:
    id: move-next
- tapOn:
    id: move-next
- tapOn:
    id: move-next
- tapOn:
    id: move-next
- tapOn:
    id: move-next
- tapOn:
    id: move-next
- tapOn:
    id: move-next
- tapOn:
    id: move-next
- tapOn:
    id: move-next
- tapOn:
    id: move-next
- tapOn:
    id: move-next
- tapOn:
    id: move-next
- tapOn:
    id: move-next
- assertVisible: '41 / 80手'
- scrollUntilVisible:
    element:
      id: analysis-status
    direction: DOWN
    timeout: 60000
- assertVisible: '解析すると候補手を確認できます。'
- assertNotVisible:
    id: analysis-ready
- takeScreenshot: partial-02-skipped-ply-empty
# The position after the gap must have its own valid result.
- tapOn:
    id: move-next
- assertVisible: '42 / 80手'
- extendedWaitUntil:
    visible:
      id: analysis-ready
    timeout: 60000
- takeScreenshot: partial-03-after-gap-evaluated
# Resume retries only missing plies -> still ends partial, never error.
# NOTE: the resume run is ~1s (16 shortfall plies x ~50ms each) so the
# transient 解析中 status cannot be caught reliably; the engine-run itself
# was verified on-device via host CPU spike. Here we assert terminal state.
- swipe:
    start: 50%, 75%
    end: 50%, 35%
- swipe:
    start: 50%, 75%
    end: 50%, 35%
- tapOn:
    id: analysis-start
- extendedWaitUntil:
    visible:
      id: analysis-status
      text: '解析中 .* / 81局面'
    timeout: 5000
    optional: true
- takeScreenshot: partial-04-resume-running
- extendedWaitUntil:
    visible: '解析処理が終了しました|全局解析が完了しました|解析に失敗しました'
    timeout: 60000
- assertVisible:
    id: analysis-status
    text: '解析処理が終了しました'
- swipe:
    start: 50%, 75%
    end: 50%, 40%
- assertVisible:
    text: '.*局面は探索量不足.*'
- assertNotVisible:
    text: '.*全局解析が完了しました.*'
- assertNotVisible:
    text: '.*解析に失敗しました.*'
- takeScreenshot: partial-05-resume-still-partial
# App restart -> honest saved count, no gap-reason claims.
- stopApp
- launchApp
- extendedWaitUntil:
    visible:
      id: library-screen
    timeout: ${INITIAL_READY_TIMEOUT}
- tapOn: '棋譜.*'
- tapOn: '.*KeroPona.*'
- extendedWaitUntil:
    visible:
      id: game-screen
    timeout: 30000
- scrollUntilVisible:
    element:
      id: analysis-status
    direction: DOWN
    timeout: 60000
- assertVisible:
    id: analysis-status
    text: '.*解析済み 65 / 81局面.*'
- assertNotVisible:
    text: '.*探索量不足.*'
- assertNotVisible:
    text: '.*全局解析が完了しました.*'
- takeScreenshot: partial-06-restart-honest
