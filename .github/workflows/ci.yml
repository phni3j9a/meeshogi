name: CI
on:
  push:
    branches: ['main', 'feat/**']
  pull_request:
permissions:
  contents: read
concurrency:
  # Late push events must not cancel a newer commit's checks.
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref_name }}-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true
env:
  CI: '1'
  EXPO_NO_TELEMETRY: '1'
  NODE_VERSION: '22.23.2'
  RUSTUP_TOOLCHAIN: '1.96.0'
jobs:
  # Fast shared checks stay on GitHub Actions. Emulator/Simulator acceptance
  # runs on the persistent Devin Cloud validation sessions; see
  # docs/DEVELOPMENT.md ("Devin Cloudのモバイル検証").
  logic:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Cloud Worker contract and fake USI checks
        run: |
          npm ci --prefix cloud
          npm run check --prefix cloud
      - run: npx expo install --check
      - run: python3 scripts/ci/test_devin_cloud.py
      - run: rustup toolchain install 1.96.0 --profile minimal --no-self-update
      - run: cargo test --manifest-path native/sekirei/Cargo.toml --locked
