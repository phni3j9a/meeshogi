name: Mobile acceptance
on:
  push:
    branches: ['main', 'feat/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mobile-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
env:
  CI: '1'
  EXPO_NO_TELEMETRY: '1'
  NODE_VERSION: '22.23.2'
  RUSTUP_TOOLCHAIN: '1.96.0'
jobs:
  logic:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npx expo install --check
      - run: rustup toolchain install 1.96.0 --profile minimal --no-self-update
      - run: cargo test --manifest-path native/sekirei/Cargo.toml --locked
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      JAVA_HOME: /usr/lib/jvm/temurin-17-jdk-amd64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699
      - run: |
          sdkmanager --install "platforms;android-36" "build-tools;36.0.0" "build-tools;35.0.0" "cmake;3.22.1" "ndk;27.1.12297006"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.1.12297006" >> "$GITHUB_ENV"
          rustup toolchain install 1.96.0 --profile minimal --no-self-update
          rustup target add aarch64-linux-android x86_64-linux-android
          cargo install cargo-ndk --version 4.1.2 --locked
      - run: npm ci
      - run: bash scripts/ci/install-maestro.sh
      - run: npx expo prebuild --platform android --no-install
      - name: Build bundled Android app
        run: |
          mkdir -p artifacts/android
          set -o pipefail
          cd android
          ./gradlew :app:assembleRelease -PreactNativeArchitectures=arm64-v8a,x86_64 --no-daemon --max-workers=2 --stacktrace 2>&1 | tee ../artifacts/android/build.log
      - name: Preserve APK
        run: cp android/app/build/outputs/apk/release/app-release.apk artifacts/android/meeshogi.apk
      - uses: ReactiveCircus/android-emulator-runner@4c44018e59b437e86cdfc41da381398f93ed8808
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_7
          ram-size: 4096M
          cores: 2
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader -no-snapshot -noaudio -no-boot-anim
          script: bash scripts/ci/android-acceptance.sh
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: android-acceptance
          path: artifacts/android
          retention-days: 7
  ios:
    runs-on: macos-26-intel
    timeout-minutes: 100
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c
        with:
          distribution: temurin
          java-version: '17'
      - run: |
          rustup toolchain install 1.96.0 --profile minimal --no-self-update
          rustup target add aarch64-apple-ios aarch64-apple-ios-sim x86_64-apple-ios
          mkdir -p artifacts/ios
          xcodebuild -version > artifacts/ios/xcode.txt
      - run: npm ci
      - run: bash scripts/ci/install-maestro.sh
      - run: npx expo prebuild --platform ios --no-install
      - run: bash scripts/engine/build-ios.sh
      - run: pod install --project-directory=ios
      - name: Build bundled iOS Simulator app
        run: |
          set -o pipefail
          xcodebuild -workspace ios/meeshogi.xcworkspace -scheme meeshogi -configuration Release -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath "$RUNNER_TEMP/meeshogi-ios" CODE_SIGNING_ALLOWED=NO ARCHS=x86_64 ONLY_ACTIVE_ARCH=YES build 2>&1 | tee artifacts/ios/build.log
      - run: bash scripts/ci/ios-acceptance.sh
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: ios-acceptance
          path: artifacts/ios
          retention-days: 7
