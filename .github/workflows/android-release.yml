name: Android APK release

on:
  workflow_call:
    secrets:
      EXPO_PUBLIC_CLOUD_ENDPOINT:
        required: true

permissions:
  contents: read

env:
  CI: '1'
  EXPO_NO_TELEMETRY: '1'
  NODE_VERSION: '22.23.2'
  RUSTUP_TOOLCHAIN: '1.96.0'
  ANDROID_NDK_VERSION: '27.1.12297006'

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version_code: ${{ steps.version.outputs.version_code }}
    env:
      BUILD_SHA: ${{ github.sha }}
      EXPO_PUBLIC_CLOUD_ENDPOINT: ${{ secrets.EXPO_PUBLIC_CLOUD_ENDPOINT }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.BUILD_SHA }}
          persist-credentials: false
      - name: Fetch only this commit's history for the update number
        run: git fetch --no-tags --filter=blob:none --unshallow origin "$BUILD_SHA"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm install --global npm@10.9.7
      - run: npm ci
      - name: Require the existing Cloud analysis endpoint
        run: test -n "$EXPO_PUBLIC_CLOUD_ENDPOINT"
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          packages: ''
      - name: Install pinned Android and Rust build tools
        run: |
          sdkmanager --install 'platform-tools' 'platforms;android-36' \
            'build-tools;36.0.0' 'build-tools;35.0.0' 'cmake;3.22.1' \
            "ndk;${ANDROID_NDK_VERSION}"
          echo "ANDROID_NDK_HOME=${ANDROID_HOME}/ndk/${ANDROID_NDK_VERSION}" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=${ANDROID_HOME}/ndk/${ANDROID_NDK_VERSION}" >> "$GITHUB_ENV"
          rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --no-self-update
          rustup target add aarch64-linux-android x86_64-linux-android
          cargo install cargo-ndk --version 4.1.2 --locked
      - name: Set source-based Android update number
        id: version
        run: |
          test "$(git rev-parse HEAD)" = "$BUILD_SHA"
          python3 scripts/ci/android-release.py prepare
      - name: Generate the Android project
        run: npx expo prebuild --platform android --non-interactive --no-install
      - name: Build standalone APK for phones and emulators
        working-directory: android
        run: >-
          ./gradlew :app:assembleRelease --no-daemon --stacktrace --max-workers=2
          -PreactNativeArchitectures=arm64-v8a,x86_64
      - name: Verify signature, update number, JS bundle and native libraries
        run: python3 scripts/ci/android-release.py verify
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: android-apk-${{ github.sha }}
          path: dist/android/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  publish:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: android-apk-${{ github.sha }}
          path: dist/android
      - name: Publish development APK
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BUILD_SHA: ${{ github.sha }}
          RELEASE_TAG: ${{ needs.build.outputs.tag }}
          VERSION_CODE: ${{ needs.build.outputs.version_code }}
          CI_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          cd dist/android
          sha256sum --check SHA256SUMS
          cat > "$RUNNER_TEMP/release-notes.md" <<EOF
          main の更新から自動生成した開発版です。

          - APK: \`meeshogi.apk\`（arm64実機 / x86_64、Metro不要）
          - ソース: https://github.com/${GH_REPO}/commit/${BUILD_SHA}
          - Android versionCode: ${VERSION_CODE}
          - 共通CI: ${CI_URL}
          - 署名: 既存評価版と共通のExpo開発用署名。ストア配布用ではありません。
          - 確認範囲: 共通CI、Releaseビルド、署名、bundle・native同梱検査。
            操作・実機性能の確認結果は対象PRを参照してください。

          APKと同じ署名の既存アプリへ上書きインストールできます。
          ダウンロード後の検証には \`SHA256SUMS\` を使用してください。
          EOF
          if gh release view "$RELEASE_TAG" --json targetCommitish > "$RUNNER_TEMP/existing-release.json" 2>/dev/null; then
            test "$(jq -r .targetCommitish "$RUNNER_TEMP/existing-release.json")" = "$BUILD_SHA"
            gh release upload "$RELEASE_TAG" meeshogi.apk SHA256SUMS build.json --clobber
          else
            gh release create "$RELEASE_TAG" meeshogi.apk SHA256SUMS build.json \
              --target "$BUILD_SHA" --title "Android 開発版 ${VERSION_CODE} (${BUILD_SHA:0:7})" \
              --prerelease --latest=false --notes-file "$RUNNER_TEMP/release-notes.md"
          fi
          echo "APK: https://github.com/${GH_REPO}/releases/download/${RELEASE_TAG}/meeshogi.apk" >> "$GITHUB_STEP_SUMMARY"
